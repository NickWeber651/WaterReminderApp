# ============================================================================
# GitHub Actions CI – WaterReminderApp
#
# Trigger:  push/PR auf main
# Runner:   Ubuntu (latest)
# Steps:    JDK 17, Android SDK, Gradle Cache, Unit-Tests, Lint, APK Build
# Output:   Artifacts: test-reports, app-debug-apk, app-release-apk
# ============================================================================

name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Nur ein CI-Lauf pro Branch gleichzeitig (spart Runner-Minuten)
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. JDK 17 (Toolchain des Projekts) ──
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 3. Android SDK ──
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 4. Gradle Cache (beschleunigt wiederholte Builds deutlich) ──
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 5. gradlew ausführbar machen (LF/CRLF-Schutz) ──
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── 6. Unit-Tests ──
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      # ── 7. Lint ──
      - name: Run lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      # ── 8. APKs bauen ──
      # Debug APK ist installierbar (ideal für schnelle Tests)
      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Release APK wird i.d.R. unsigned sein, solange du kein Signing in CI konfigurierst
      - name: Assemble Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ── 9. Test-Reports hochladen (auch bei Fehler) ──
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14

      # ── 10. Debug APK als Artifact (installierbar) ──
      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # ── 11. Release APK als Artifact (meist unsigned) ──
      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
